[package]
name = "modloader"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
common = { path = "../common" }
game = { path = "../game" }
jvm = { path = "../jvm" }
mod_protocol = { path = "../../vendor/b1.7.3-modding-sdk/mod_protocol" }
png = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
